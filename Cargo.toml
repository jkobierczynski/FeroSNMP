[workspace]
resolver = "3"
members = [
    "crates/mib-core",
    "crates/snmp-core",
    "crates/trap-rx",
    "crates/fero-win32",
    "apps/cli",
    "apps/gui",
]
# The fuzz crate needs nightly and libFuzzer, so it is built on its own with
# `cargo +nightly fuzz` rather than as part of the workspace.
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/jkobierczynski/ferosnmp"
publish = false

[workspace.dependencies]
mib-core = { path = "crates/mib-core" }
snmp-core = { path = "crates/snmp-core" }
trap-rx = { path = "crates/trap-rx" }
fero-win32 = { path = "crates/fero-win32" }

# mib-rs is pre-1.0 and may break its API in any minor release, so it is pinned
# to an exact version and only used inside mib-core.
mib-rs = { version = "=0.10.0", default-features = false }
thiserror = "2"
insta = "1"
# The SNMP engine (snmp-core): BER parsing from snmp2, the event loop from
# tokio. snmp2's default features include SNMPv3 with pure-Rust crypto and
# its own tokio sessions; both stay off (see crates/snmp-core/README.md, and
# the crypto backend decision for M7).
snmp2 = { version = "0.5.2", default-features = false }
tokio = { version = "1.47", features = ["macros", "net", "rt", "sync", "time"] }
# SNMPv3 crypto (snmp-core): pure Rust, from RustCrypto, so no OpenSSL to
# build or ship on Windows.
aes = "0.9"
des = "0.9"
hmac = "0.13"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
# Used only by the CLI: argument parsing and JSON output.
clap = { version = "4.6", features = ["derive", "env"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Used only by the GUI: Win32 bindings, the application manifest, and the
# settings file.
windows = "0.62"
embed-manifest = "1.5"
serde = { version = "1", features = ["derive"] }
toml = "1.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

