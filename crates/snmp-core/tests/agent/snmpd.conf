# net-snmp snmpd configuration for the query tests: a fixed set of objects on
# 127.0.0.1:11161, readable with community "public" over SNMPv1 and SNMPv2c,
# and by SNMPv3 users (at the end).
# Started by run-agent.sh, which passes -C so no other configuration is read.

agentAddress udp:127.0.0.1:11161

# Only objects whose values never change, so walk output can be compared with
# stored files: the system group without sysUpTime and sysORTable, and the
# FEROSNMP-TEST-MIB objects served by fst_agent.py.
view golden included .1.3.6.1.2.1.1.1
view golden included .1.3.6.1.2.1.1.2
view golden included .1.3.6.1.2.1.1.4
view golden included .1.3.6.1.2.1.1.5
view golden included .1.3.6.1.2.1.1.6
view golden included .1.3.6.1.2.1.1.7
view golden included .1.3.6.1.4.1.8072.9999.1
# fstSettings can be written, so its values change; it is left out of the
# golden view and only reachable with community "private" (or the SNMPv3
# user v3-writer), which may read and write it.
view golden excluded .1.3.6.1.4.1.8072.9999.1.3
view settings included .1.3.6.1.4.1.8072.9999.1.3

rocommunity public 127.0.0.1 -V golden
rwcommunity private 127.0.0.1 -V settings

sysDescr    FeroSNMP test agent (net-snmp)
sysObjectID .1.3.6.1.4.1.8072.9999.1
sysContact  FeroSNMP tests
sysName     ferosnmp-test
sysLocation CI
sysServices 72

pass_persist .1.3.6.1.4.1.8072.9999.1 /usr/bin/env python3 @AGENT_DIR@/fst_agent.py

# SNMPv3 users for the protocol matrix in apps/cli/tests/agent.rs: one per
# authentication and privacy protocol, named v3-AUTH-PRIV, with the
# passwords "ferosnmp-auth" and "ferosnmp-priv", and one user without
# authentication. Each may read the same objects as the community. net-snmp
# calls the AES-192/256 key extension most agents use AES-192 and AES-256;
# Cisco's (AES-192C, AES-256C) is not built into Debian's net-snmp, so it is
# only covered by unit tests.
createUser v3-noauth
rouser v3-noauth noauth -V golden
createUser v3-md5-none MD5 ferosnmp-auth
rouser v3-md5-none auth -V golden
createUser v3-md5-des MD5 ferosnmp-auth DES ferosnmp-priv
rouser v3-md5-des priv -V golden
createUser v3-md5-aes MD5 ferosnmp-auth AES ferosnmp-priv
rouser v3-md5-aes priv -V golden
createUser v3-md5-aes192 MD5 ferosnmp-auth AES-192 ferosnmp-priv
rouser v3-md5-aes192 priv -V golden
createUser v3-md5-aes256 MD5 ferosnmp-auth AES-256 ferosnmp-priv
rouser v3-md5-aes256 priv -V golden
createUser v3-sha-none SHA ferosnmp-auth
rouser v3-sha-none auth -V golden
createUser v3-sha-des SHA ferosnmp-auth DES ferosnmp-priv
rouser v3-sha-des priv -V golden
createUser v3-sha-aes SHA ferosnmp-auth AES ferosnmp-priv
rouser v3-sha-aes priv -V golden
createUser v3-sha-aes192 SHA ferosnmp-auth AES-192 ferosnmp-priv
rouser v3-sha-aes192 priv -V golden
createUser v3-sha-aes256 SHA ferosnmp-auth AES-256 ferosnmp-priv
rouser v3-sha-aes256 priv -V golden
createUser v3-sha224-none SHA-224 ferosnmp-auth
rouser v3-sha224-none auth -V golden
createUser v3-sha224-des SHA-224 ferosnmp-auth DES ferosnmp-priv
rouser v3-sha224-des priv -V golden
createUser v3-sha224-aes SHA-224 ferosnmp-auth AES ferosnmp-priv
rouser v3-sha224-aes priv -V golden
createUser v3-sha224-aes192 SHA-224 ferosnmp-auth AES-192 ferosnmp-priv
rouser v3-sha224-aes192 priv -V golden
createUser v3-sha224-aes256 SHA-224 ferosnmp-auth AES-256 ferosnmp-priv
rouser v3-sha224-aes256 priv -V golden
createUser v3-sha256-none SHA-256 ferosnmp-auth
rouser v3-sha256-none auth -V golden
createUser v3-sha256-des SHA-256 ferosnmp-auth DES ferosnmp-priv
rouser v3-sha256-des priv -V golden
createUser v3-sha256-aes SHA-256 ferosnmp-auth AES ferosnmp-priv
rouser v3-sha256-aes priv -V golden
createUser v3-sha256-aes192 SHA-256 ferosnmp-auth AES-192 ferosnmp-priv
rouser v3-sha256-aes192 priv -V golden
createUser v3-sha256-aes256 SHA-256 ferosnmp-auth AES-256 ferosnmp-priv
rouser v3-sha256-aes256 priv -V golden
createUser v3-sha384-none SHA-384 ferosnmp-auth
rouser v3-sha384-none auth -V golden
createUser v3-sha384-des SHA-384 ferosnmp-auth DES ferosnmp-priv
rouser v3-sha384-des priv -V golden
createUser v3-sha384-aes SHA-384 ferosnmp-auth AES ferosnmp-priv
rouser v3-sha384-aes priv -V golden
createUser v3-sha384-aes192 SHA-384 ferosnmp-auth AES-192 ferosnmp-priv
rouser v3-sha384-aes192 priv -V golden
createUser v3-sha384-aes256 SHA-384 ferosnmp-auth AES-256 ferosnmp-priv
rouser v3-sha384-aes256 priv -V golden
createUser v3-sha512-none SHA-512 ferosnmp-auth
rouser v3-sha512-none auth -V golden
createUser v3-sha512-des SHA-512 ferosnmp-auth DES ferosnmp-priv
rouser v3-sha512-des priv -V golden
createUser v3-sha512-aes SHA-512 ferosnmp-auth AES ferosnmp-priv
rouser v3-sha512-aes priv -V golden
createUser v3-sha512-aes192 SHA-512 ferosnmp-auth AES-192 ferosnmp-priv
rouser v3-sha512-aes192 priv -V golden
createUser v3-sha512-aes256 SHA-512 ferosnmp-auth AES-256 ferosnmp-priv
rouser v3-sha512-aes256 priv -V golden

# A user who may read and write fstSettings, for the SET tests.
createUser v3-writer SHA-256 ferosnmp-auth AES ferosnmp-priv
rwuser v3-writer priv -V settings
