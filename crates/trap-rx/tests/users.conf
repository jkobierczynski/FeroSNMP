# SNMPv3 trap users for the trap tests (apps/cli/tests/traps.rs), as net-snmp
# createUser lines: one per authentication and privacy protocol, named
# trap-AUTH-PRIV, with the passwords "ferosnmp-auth" and "ferosnmp-priv", and
# one user without authentication. Without -e, each is accepted from any
# sender; trap-bound only from the engine 0x80001f88040102030405.
createUser trap-noauth
createUser trap-md5-none MD5 ferosnmp-auth
createUser trap-md5-des MD5 ferosnmp-auth DES ferosnmp-priv
createUser trap-md5-aes MD5 ferosnmp-auth AES ferosnmp-priv
createUser trap-md5-aes192 MD5 ferosnmp-auth AES-192 ferosnmp-priv
createUser trap-md5-aes256 MD5 ferosnmp-auth AES-256 ferosnmp-priv
createUser trap-sha-none SHA ferosnmp-auth
createUser trap-sha-des SHA ferosnmp-auth DES ferosnmp-priv
createUser trap-sha-aes SHA ferosnmp-auth AES ferosnmp-priv
createUser trap-sha-aes192 SHA ferosnmp-auth AES-192 ferosnmp-priv
createUser trap-sha-aes256 SHA ferosnmp-auth AES-256 ferosnmp-priv
createUser trap-sha224-none SHA-224 ferosnmp-auth
createUser trap-sha224-des SHA-224 ferosnmp-auth DES ferosnmp-priv
createUser trap-sha224-aes SHA-224 ferosnmp-auth AES ferosnmp-priv
createUser trap-sha224-aes192 SHA-224 ferosnmp-auth AES-192 ferosnmp-priv
createUser trap-sha224-aes256 SHA-224 ferosnmp-auth AES-256 ferosnmp-priv
createUser trap-sha256-none SHA-256 ferosnmp-auth
createUser trap-sha256-des SHA-256 ferosnmp-auth DES ferosnmp-priv
createUser trap-sha256-aes SHA-256 ferosnmp-auth AES ferosnmp-priv
createUser trap-sha256-aes192 SHA-256 ferosnmp-auth AES-192 ferosnmp-priv
createUser trap-sha256-aes256 SHA-256 ferosnmp-auth AES-256 ferosnmp-priv
createUser trap-sha384-none SHA-384 ferosnmp-auth
createUser trap-sha384-des SHA-384 ferosnmp-auth DES ferosnmp-priv
createUser trap-sha384-aes SHA-384 ferosnmp-auth AES ferosnmp-priv
createUser trap-sha384-aes192 SHA-384 ferosnmp-auth AES-192 ferosnmp-priv
createUser trap-sha384-aes256 SHA-384 ferosnmp-auth AES-256 ferosnmp-priv
createUser trap-sha512-none SHA-512 ferosnmp-auth
createUser trap-sha512-des SHA-512 ferosnmp-auth DES ferosnmp-priv
createUser trap-sha512-aes SHA-512 ferosnmp-auth AES ferosnmp-priv
createUser trap-sha512-aes192 SHA-512 ferosnmp-auth AES-192 ferosnmp-priv
createUser trap-sha512-aes256 SHA-512 ferosnmp-auth AES-256 ferosnmp-priv
createUser -e 0x80001f88040102030405 trap-bound SHA ferosnmp-auth AES ferosnmp-priv
# Lines that are not createUser, as in a snmptrapd.conf, are skipped.
authUser log,execute,net trap-noauth noauth
