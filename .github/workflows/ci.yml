name: CI

# The job names "Build and test (Windows)", "cargo deny", "cargo audit" and
# "Fuzz smoke run" are required checks in branch protection. Renaming a job
# here means updating branch protection too.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so new RustSec advisories show up even when nothing is pushed.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the version pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  corpus:
    # Also loads the vendor and older RFC MIBs that cannot be committed. Not a
    # required check: it depends on vendor download sites being up.
    name: Full MIB corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: corpus/fetched
          key: corpus-${{ hashFiles('corpus/manifest.tsv') }}
      - run: corpus/fetch.sh
      - run: cargo test -p mib-core --test corpus --locked
      # `ferosnmp lint corpus` against its stored snapshot.
      - run: cargo test -p ferosnmp-cli --test cli --locked

  agent:
    # get/next/bulk/walk against a real net-snmp agent with fixed values,
    # compared with the snapshots in apps/cli/tests/snapshots.
    name: Query tests (net-snmp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y snmpd
      - run: crates/snmp-core/tests/agent/run-agent.sh
      - run: cargo test -p ferosnmp-cli --test agent --locked
        env:
          FEROSNMP_TEST_AGENT: 127.0.0.1:11161
      - name: Show the agent's log
        if: failure()
        run: cat "${TMPDIR:-/tmp}/ferosnmp-test-agent/snmpd.log"

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  fuzz:
    name: Fuzz smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo-fuzz needs a nightly compiler for the sanitizer flags.
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Seed the fuzzer with the committed MIBs
        run: |
          mkdir -p fuzz/corpus/load_module
          cp corpus/ietf/* fuzz/corpus/load_module/
      # The prebuilt cargo-fuzz is a musl binary and would default to the musl
      # target, which nightly has no sanitizer-ready std for; ask for glibc.
      - name: Fuzz for 60 seconds
        run: >
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu load_module --
          -max_total_time=60 -max_len=131072 -timeout=10 -rss_limit_mb=2048
      - name: Keep the input that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
